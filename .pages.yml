media:
  input: public/media
  output: /media

content:
  - name: identity
    label: Identity
    type: file
    path: src/data/identity.json
    format: json
    fields:
      - name: name
        label: Full name
        type: string
        required: true
      - name: short_name
        label: Nav name
        type: string
      - name: avatar_url
        label: Avatar
        type: image
  - name: hero
    label: Hero
    type: file
    path: src/data/hero.json
    format: json
    fields:
      - name: availability_label
        label: Availability badge
        type: string
      - name: headline
        label: Headline
        type: string
      - name: hero_bio
        label: Hero bio
        type: text
  - name: about
    label: About
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: about
        label: About (blank line = new paragraph)
        type: text
  - name: contact
    label: Contact
    type: file
    path: src/data/contact.json
    format: json
    fields:
      - name: contact_heading
        label: Contact heading
        type: string
      - name: contact_subtext
        label: Contact subtext
        type: text
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
      - name: footer_text
        label: Footer text
        type: string
  - name: experience
    label: Experience
    type: file
    path: src/data/experience.json
    format: json
    fields:
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: period
            label: Period
            type: string
          - name: role
            label: Role
            type: string
            required: true
          - name: company
            label: Company
            type: string
          - name: location
            label: Location
            type: string
          - name: description
            label: Description
            type: text
  - name: skills
    label: Skills
    type: file
    path: src/data/skills.json
    format: json
    fields:
      - name: skills
        label: What I do
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
  - name: projects
    label: Projects
    type: file
    path: src/data/projects.json
    format: json
    fields:
      - name: projects
        label: Selected work
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: cover_image_url
            label: Image
            type: image
  - name: gallery
    label: Gallery
    type: file
    path: src/data/gallery.json
    format: json
    fields:
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: image_url
            label: Image (before)
            type: image
            required: true
          - name: secondary_image_url
            label: After image (optional — enables before/after slider)
            type: image
          - name: description
            label: Caption
            type: string
