<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="%SEO_IMAGE%" />
    <link rel="apple-touch-icon" href="%SEO_IMAGE%" />
    <link rel="canonical" href="https://mohammadsamadi.com/" />
    <meta name="theme-color" content="#ffffff" />

    <!-- %SEO_*% placeholders are filled at build time from Convex
         site_settings by the seo-html plugin (scripts/seo-html.ts). -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="author" content="%SEO_AUTHOR%" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SEO_SITE_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="https://mohammadsamadi.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE%" />

    <!-- Structured data: local contractor (helps Google local / rich results) -->
    <script type="application/ld+json">
      %SEO_JSONLD%
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
